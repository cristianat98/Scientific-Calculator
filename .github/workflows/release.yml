name: Release

on:
  workflow_run:
    workflows: [Check code]
    types: [completed]
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Only after a green check of a push to master, and never for the release's own bump commit.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'bump: version ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Check master is still at the checked commit
        id: tip
        env:
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$CHECKED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master moved past $CHECKED_SHA; the newer commit's check run will release it."
          fi
      - name: Semantic release
        id: release
        if: steps.tip.outputs.current == 'true'
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3
      - run: pip install -r requirements-dev.txt .
      - run: pyinstaller --noconfirm scientific-calculator.spec

      - name: Smoke test and archive (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/scientific-calculator/scientific-calculator --smoke
          tar -C dist -czf "scientific-calculator-$TAG-${{ matrix.target }}.tar.gz" scientific-calculator
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A windowed exe does not block the shell, so wait for it explicitly.
        run: |
          $p = Start-Process -FilePath dist/scientific-calculator/scientific-calculator.exe -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/scientific-calculator -DestinationPath "scientific-calculator-$env:TAG-${{ matrix.target }}.zip"
      - name: Smoke test and archive (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/Scientific Calculator.app/Contents/MacOS/scientific-calculator" --smoke
          ditto -c -k --keepParent "dist/Scientific Calculator.app" "scientific-calculator-$TAG-${{ matrix.target }}.zip"

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" scientific-calculator-"$TAG"-${{ matrix.target }}.* --clobber
