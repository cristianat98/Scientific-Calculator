name: Release

on:
  # Called by the Check code workflow once every check passed on a push to master.
  workflow_call:
  # Rebuilds and publishes an existing tag, e.g. after a failed build.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      release_notes: ${{ steps.release.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Check master is still at the checked commit
        id: tip
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$CHECKED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master moved past $CHECKED_SHA; the newer commit's check run will release it."
          fi
      - name: Semantic release
        id: release
        if: steps.tip.outputs.current == 'true'
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The GitHub Release is published only after every build passes (publish job).
          vcs_release: "false"

  build:
    needs: release
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release.outputs.released == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3
      - run: 'pip install --only-binary :all: --require-hashes -r requirements-dev.txt'
      - run: pyinstaller --noconfirm scientific-calculator.spec

      - name: Smoke test and archive (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          dist/scientific-calculator/scientific-calculator --smoke
          tar -C dist -czf "scientific-calculator-$TAG-${{ matrix.target }}.tar.gz" scientific-calculator
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        # A windowed exe does not block the shell, so wait for it explicitly.
        run: |
          $p = Start-Process -FilePath dist/scientific-calculator/scientific-calculator.exe -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/scientific-calculator -DestinationPath "scientific-calculator-$env:TAG-${{ matrix.target }}.zip"
      - name: Smoke test and archive (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          "dist/Scientific Calculator.app/Contents/MacOS/scientific-calculator" --smoke
          ditto -c -k --keepParent "dist/Scientific Calculator.app" "scientific-calculator-$TAG-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: scientific-calculator-${{ env.TAG }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [release, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_NOTES: ${{ needs.release.outputs.release_notes }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: assets
          merge-multiple: true
      - name: Publish the GitHub Release with the builds
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          elif [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > notes.md
            gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --verify-tag --title "$TAG" --generate-notes
          fi
